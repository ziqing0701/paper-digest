<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报告模板 · Paper Digest</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="wrap">
  <article class="report">
    <a class="back" href="../index.html">← 返回论文精读首页</a>
    <p class="eyebrow">REPORT TEMPLATE</p>
    <h1>顶刊论文精读 · 报告模板</h1>
    <p class="sub">实际定时任务将按日期创建 reports/YYYY-MM-DD.html。</p>
    <div class="toc">
      <strong>每篇论文固定包含</strong>
      <p>文献信息、研究问题、核心假设、数据/实验/模型、关键结果、创新点、科研故事线、顶刊特征、薄弱点、科研迁移启发，以及科研判断训练。</p>
    </div>
    <h2>科研故事线</h2>
    <p>现象/矛盾 → 科学问题 → 核心假设 → 证据链 → 机制验证 → 稳健性与泛化 → 闭环结论。</p>
    <h2>归档说明</h2>
    <p>首页从 archive.json 自动读取论文记录，因此后续通常只需要新增每日报告并更新 archive.json。</p>
  </article>
</main>
</body>
</html>
